<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2113" />
      <stop offset="50%" stop-color="#7B2C16" />
      <stop offset="100%" stop-color="#260F08" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#E8A33A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8A33A" />
      <stop offset="100%" stop-color="#A9472A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle with double gold ring -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#FFE082" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Tiny Heritage Sparkle / Star at top center -->
  <g transform="translate(256, 110) scale(0.9)">
    <path d="M0 -32 Q0 0 32 0 Q0 0 0 32 Q0 0 -32 0 Q0 0 0 -32 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <circle cx="0" cy="0" r="5" fill="#FFF8E7" />
  </g>

  <!-- Main Monogram "MSS" with Royal Serif Styling -->
  <g filter="url(#goldGlow)">
    <text
      x="256"
      y="325"
      text-anchor="middle"
      font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif"
      font-size="160"
      font-weight="900"
      letter-spacing="6"
      fill="url(#goldGrad)"
    >
      MSS
    </text>
  </g>

  <!-- Subtitle Tag: MOM'S SECRET SPICES -->
  <text
    x="256"
    y="390"
    text-anchor="middle"
    font-family="'Inter', 'Sora', sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="5"
    fill="#FFE082"
    opacity="0.95"
  >
    MOM'S SECRET SPICES
  </text>

  <!-- Established year tag -->
  <text
    x="256"
    y="422"
    text-anchor="middle"
    font-family="'Inter', 'Sora', sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="3"
    fill="#F5EBE1"
    opacity="0.75"
  >
    EST. 1998
  </text>
</svg>
